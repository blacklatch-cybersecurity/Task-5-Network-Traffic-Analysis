<!doctype html>
<html>
<head><meta charset="utf-8"><title>Web Vulnerability Scanner</title></head>
<body>
  <h1>Web Vulnerability Scanner</h1>
  <form action="/scan" method="post">
    <label>Target URL: <input type="text" name="url" placeholder="https://example.com" size="60" required></label><br>
    <label>Max pages to crawl: <input type="number" name="max_pages" value="20"></label><br>
    <button type="submit">Start Scan</button>
  </form>
  <p>Ethics: scan only authorized domains.</p>
  <a href="/last">View last results</a>
</body>
</html>
